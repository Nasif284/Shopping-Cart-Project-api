name: Deploy Shopping Cart app

on:
    push:
        branches: 
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source
              uses: actions/checkout@v4
            - name: Login To DockerHub
              run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            - name: Build Docker Image
              run: docker build -t nasif284/gracia-shopping-cart .
            - name: Publish image to docker hub
              run: docker push nasif284/gracia-shopping-cart:latest
    deploy:
        needs: build
        runs-on: self-hosted
        steps:
            - name: Create .env file on server
              run: echo "${{ secrets.APP_ENV }}" > /home/ubuntu/.env
            - name: delete old container
              run: docker rm -f shopping-cart-app-container
            - name: free up docker storage
              run: docker system prune -a -f
            - name: Pull the latest image form docker hub
              run: docker pull nasif284/gracia-shopping-cart:latest
            - name: run docker container 
              run: |
                  docker run -d \
                  --restart unless-stopped \
                  -p 8000:8000 \
                  --env-file /home/ubuntu/.env \
                  --name shopping-cart-app-container \
                  nasif284/gracia-shopping-cart:latest

      
